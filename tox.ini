# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
skipsdist = True
usedevelop = True
envlist =
    py310-dj42-wt{70,71}
    py{310,311,312,313}-dj{51,52}-wt{70,72}
    py314-dj52-wt72

[testenv]
install_command = pip install -e ".[testing]" -U {opts} {packages}
whitelist_externals =
    make
    pip
allowlist_externals = make

basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14

deps =
    dj42: Django>=4.2,<4.3
    dj51: Django>=5.1,<5.2
    dj52: Django>=5.2,<5.3
    wt70: wagtail>=7.0,<7.1
    wt72: wagtail>=7.2,<7.3

commands =
    make lint
    make test-coverage

[gh]
python =
    3.14 = 3.14
    3.13 = 3.13
    3.12 = 3.12
    3.11 = 3.11
